name: Release MyClash

on:
  push:
    branches:
      - "release/*"

permissions:
  contents: read

env:
  MYCLASH_BUILD_NUMBER: ${{ github.run_number }}
  MYCLASH_DMG_CUSTOMIZE_FINDER: 0
  CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/.build/module-cache

jobs:
  test:
    name: Test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build/swiftpm-cache
            .build/module-cache
          key: ${{ runner.os }}-swiftpm-test-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-test-
            ${{ runner.os }}-swiftpm-

      - name: Run tests
        run: swift test --cache-path .build/swiftpm-cache

  package:
    name: Package
    runs-on: macos-15
    needs: test
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Read package metadata
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Packaging/Info.plist)"
          echo "MYCLASH_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "MYCLASH_RELEASE_TAG=v${version}-build.${GITHUB_RUN_NUMBER}" >> "${GITHUB_ENV}"
          echo "MYCLASH_RELEASE_TITLE=MyClash ${version} build ${GITHUB_RUN_NUMBER}" >> "${GITHUB_ENV}"

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build/swiftpm-cache
            .build/module-cache
          key: ${{ runner.os }}-swiftpm-package-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-package-
            ${{ runner.os }}-swiftpm-

      - name: Build release app bundle
        run: scripts/package-myclash.sh

      - name: Build DMG
        run: scripts/package-dmg.sh

      - name: Write release notes
        run: |
          short_sha="${GITHUB_SHA::7}"
          cat > release-notes.md <<EOF
          ## 发布说明

          本次发布由 \`${GITHUB_REF_NAME}\` 分支提交自动构建生成。

          - 应用版本：\`${MYCLASH_VERSION}\`
          - 构建号：\`${MYCLASH_BUILD_NUMBER}\`
          - 发布标签：\`${MYCLASH_RELEASE_TAG}\`
          - 提交：\`${short_sha}\`
          - 系统代理端口：\`9809\`
          - External Controller：\`127.0.0.1:9090\`

          ## 构建产物

          - \`MyClash-${MYCLASH_VERSION}-${MYCLASH_BUILD_NUMBER}.dmg\`
          - \`MyClash-${MYCLASH_VERSION}-${MYCLASH_BUILD_NUMBER}.zip\`

          ## 安装说明

          下载 DMG 后，将 \`MyClash.app\` 拖入 Applications 文件夹即可安装。

          ## 签名说明

          当前 Actions 构建使用 ad-hoc 签名，未进行 Developer ID 签名和 Apple 公证。
          EOF

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${MYCLASH_RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${MYCLASH_RELEASE_TITLE}" \
            --notes-file release-notes.md \
            "dist/MyClash-${MYCLASH_VERSION}-${MYCLASH_BUILD_NUMBER}.zip" \
            "dist/MyClash-${MYCLASH_VERSION}-${MYCLASH_BUILD_NUMBER}.dmg"
