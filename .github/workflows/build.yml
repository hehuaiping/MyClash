name: Build MyClash

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  MYCLASH_BUILD_NUMBER: ${{ github.run_number }}
  MYCLASH_DMG_CUSTOMIZE_FINDER: 0
  CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/.build/module-cache

jobs:
  test:
    name: Test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build/swiftpm-cache
            .build/module-cache
          key: ${{ runner.os }}-swiftpm-test-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-test-
            ${{ runner.os }}-swiftpm-

      - name: Run tests
        run: swift test --cache-path .build/swiftpm-cache

  package:
    name: Package
    runs-on: macos-15
    needs: test
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Read package metadata
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Packaging/Info.plist)"
          echo "MYCLASH_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build/swiftpm-cache
            .build/module-cache
          key: ${{ runner.os }}-swiftpm-package-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-package-
            ${{ runner.os }}-swiftpm-

      - name: Build release app bundle
        run: scripts/package-myclash.sh

      - name: Build DMG
        run: scripts/package-dmg.sh

      - name: Upload app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyClash-${{ env.MYCLASH_VERSION }}-${{ env.MYCLASH_BUILD_NUMBER }}
          path: |
            dist/MyClash-${{ env.MYCLASH_VERSION }}-${{ env.MYCLASH_BUILD_NUMBER }}.zip
            dist/MyClash-${{ env.MYCLASH_VERSION }}-${{ env.MYCLASH_BUILD_NUMBER }}.dmg
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "MyClash ${GITHUB_REF_NAME}" \
            --notes "Automated MyClash build for ${GITHUB_REF_NAME}." \
            "dist/MyClash-${MYCLASH_VERSION}-${MYCLASH_BUILD_NUMBER}.zip" \
            "dist/MyClash-${MYCLASH_VERSION}-${MYCLASH_BUILD_NUMBER}.dmg"
